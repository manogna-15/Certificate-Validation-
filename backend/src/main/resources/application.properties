server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/certificate_db
spring.datasource.username=postgres
spring.datasource.password=smartgrow123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGeneration2024CertificateValidationSystem
app.jwt.expiration=86400000

# Application Paths
app.qrcode.directory=src/main/resources/static/qrcodes/
app.certificate.directory=src/main/resources/certificates/
app.base-url=http://192.168.29.24:8080
app.frontend-url=http://192.168.29.24:3000
