server.port=8080

# PostgreSQL Database Configuration (Docker)
spring.datasource.url=jdbc:postgresql://postgres:5432/certificate_db
spring.datasource.username=postgres
spring.datasource.password=smartgrow123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGeneration2024CertificateValidationSystem
app.jwt.expiration=86400000

# Application Paths (Docker volumes)
app.qrcode.directory=/app/data/qrcodes/
app.certificate.directory=/app/data/certificates/
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
